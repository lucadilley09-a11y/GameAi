<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game AI Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Pixelify+Sans:wght@700&display=swap" rel="stylesheet">
<style>
/* VOICE: a hacker's game console; IDEA: a terminal wired to a handheld screen
   PICTURE: the terminal and the live game side by side; COLOUR and TYPE: near-black, lime accent, JetBrains Mono
   LAYOUT: terminal left, game right; stacks on narrow screens */
:root{color-scheme:dark;--bg:#0b0d16;--panel:#11141f;--line:#232840;--ink:#e6e8f2;--dim:#8a90ad;--acc:#b6f24a;--warn:#ffcf5c;--bad:#ff7a8a}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "JetBrains Mono",ui-monospace,monospace;overflow-x:clip}
header{display:flex;align-items:baseline;gap:14px;padding:14px max(3vw,14px) 4px;flex-wrap:wrap}
h1{font:700 26px/1 "Pixelify Sans",system-ui,sans-serif;margin:0;color:var(--acc)}
header span{color:var(--dim);font-size:13px}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;padding:10px max(3vw,14px) 24px;height:calc(100vh - 60px);min-height:560px}
@media(max-width:900px){main{grid-template-columns:minmax(0,1fr);height:auto}.term{height:70vh}}
.term{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
#log{flex:1;overflow-y:auto;padding:14px 16px;white-space:pre-wrap;word-break:break-word}
.row{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:10px 14px}
.row b{color:var(--acc)}
#in{flex:1;background:transparent;border:0;color:var(--ink);font:inherit;font-size:16px;outline:none;min-height:32px}
.u{color:var(--ink)}.a{color:var(--acc)}.d{color:var(--dim)}.w{color:var(--warn)}.e{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chips button{font:inherit;font-size:13px;background:#1a1f33;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-height:36px;cursor:pointer}
.chips button:hover,.chips button:focus-visible{border-color:var(--acc);outline:none}
table{border-collapse:collapse;margin:4px 0 6px}td{padding:1px 14px 1px 0}
.screen{background:#1d2142;border-radius:18px;padding:14px;align-self:start}
canvas{display:block;width:100%;aspect-ratio:4/3;border-radius:8px;background:#000}
canvas:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.hint{color:#aeb4dc;font-size:12px;margin-top:8px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
.stub{display:none}
.prog{border-top:1px solid var(--line);padding:10px 14px;display:none}.prog.on{display:block}
.bar{height:10px;background:#232840;border-radius:5px;overflow:hidden;margin:6px 0}.bar>div{height:100%;background:var(--acc);width:0;transition:width .4s}
pre.ban{color:var(--acc);margin:0 0 4px;font-size:11px;line-height:1.15;white-space:pre}
body.drag .term{outline:3px dashed var(--acc);outline-offset:-3px}
</style></head><body>
<header><h1>Game AI</h1><span id="mode">starting…</span></header>
<main>
 <section class="term" aria-label="Terminal">
  <div id="log" role="log" aria-live="polite"></div>
  <div class="prog" id="prog"><div id="gtitle" class="a"></div><svg id="graph" viewBox="0 0 600 170" style="width:100%;height:170px;display:block"></svg><div id="ptext" class="d"></div></div>
  <div class="row"><b>&gt;</b><input id="in" autocomplete="off" spellcheck="false" placeholder="type a game idea, or /help" aria-label="Terminal input"></div>
 </section>
 <section class="screen">
  <canvas id="game" width="640" height="480" tabindex="0" aria-label="Game screen"></canvas>
  <div class="hint"><span>Click the game, then arrows or WASD to move</span><span>R: play again · click the terminal to type</span></div>
 </section>
</main>
<button id="editBtn" class="stub"></button><button id="restartBtn" class="stub"></button>
<input id="files" type="file" multiple accept=".json,.bin" class="stub">
<script>/*BUILTIN*/</script>
<script>/*WEB_AI*/</script>
<script>
{
const $=id=>document.getElementById(id);
const rnd=a=>a[Math.random()*a.length|0],ri=n=>Math.random()*n|0;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=ri(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
let F={},FN=[],trained=false,AI=null;

/*ENGINE*/

const log=$('log'),inp=$('in');
const say=(html,cls='a')=>{const d=document.createElement('div');d.className=cls;d.innerHTML=html;log.appendChild(d);log.scrollTop=log.scrollHeight;return d};
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const GATE=.45,IMPORTANT=['goal','enemy','theme','player'];
const QTEXT={goal:"What's the goal?",enemy:'What should chase you?',theme:'Where does it take place?',player:'Who do you play as?'};
const LABEL={none:'none (peaceful)',exit:'find the exit',survive:'survive'};
let askOn=store.get('gameai.ask',true),lastGame=null,pending=null;

let API=null,lastWhere='';
function useAI(ai,where){
 AI=ai;FN=ai.fields;F=Object.fromEntries(FN.map((f,i)=>[f,Object.fromEntries(ai.options[i].filter(v=>v!=='auto').map(v=>[v,1]))]));trained=true;
 say(`Ready. Describe a game you want, like "a ninja in a spooky dungeon". Type /help for more.`,'a');lastWhere=where;
}
const b64buf=b=>{const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer};
const idb=(mode,fn)=>new Promise((res,rej)=>{try{const r=indexedDB.open('gameai',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');
 r.onsuccess=()=>{const t=r.result.transaction('kv',mode),q=fn(t.objectStore('kv'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)};r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
const remember=m=>idb('readwrite',st=>st.put(m,'model')).catch(()=>{});
const recall=()=>idb('readonly',st=>st.get('model')).catch(()=>null);
async function boot(){
 API=await fetch('api/status').then(r=>r.ok?r.json():null).catch(()=>null);
 if(API&&API.app){
  const remote=!/^(127\.0\.0\.1|localhost)$/.test(location.hostname);$('mode').textContent=(remote?'Connected to your PC · ':'PC app · ')+(API.gpu||'CPU');
  if(API.loaded){const ai=await fetch('api/model').then(r=>r.json()).catch(()=>null);if(ai)useAI(createAI(ai,b64buf(ai.b64)),'your trained AI, running on '+(API.gpu?'the GPU':'the CPU'))}
  else say(API.note?'Your AI needs one retrain for the new game rules. Type /train (about 10-30 minutes). Until then it can\'t make games.':'No trained AI yet. Type /train to train one (about 10-30 minutes on your GPU).','w');
  if(API.fresh)say(`Right now it gets about ${Math.floor(API.fresh.exact*1000)/10}% of game ideas exactly right.`,'d');
  if(!window.__ver){window.__ver=API.version;setInterval(async()=>{const st=await fetch('api/status').then(r=>r.ok?r.json():null).catch(()=>null);
   if(st&&st.version&&st.version!==window.__ver){window.__ver=st.version;say(`Updated: ${esc(st.update_msg||'new version')}. Reloading…`,'a');setTimeout(()=>location.reload(),1500)}},5000)}
  if(API.update_msg&&API.version!=='dev')say(`Version ${esc(API.version)}: ${esc(API.update_msg)}`,'d');
  if(API.training)watch();else showLearning('').then(ok=>{if(ok)$('prog').classList.add('on')});
  return;
 }
 $('mode').textContent='Chromebook edition';
 if(window.GAMEAI_BUILTIN){try{useAI(createAI(window.GAMEAI_BUILTIN,b64buf(window.GAMEAI_BUILTIN.b64)),'your trained AI (built into this file)');return}catch(e){}}
 const saved=await recall();
 if(saved){try{useAI(createAI(saved,b64buf(saved.b64)),'your model, remembered in this browser');return}catch(e){}}
 try{const [m,b]=await Promise.all([fetch('model.json').then(r=>r.json()),fetch('weights.json').then(r=>r.json())]);useAI(createAI(m,b64buf(b.b64)),'test model; drag your gameai-model.json here to use yours')}
 catch(e){say('No model found. Drag your gameai-model.json onto this page, or type /load.','w')}
}
async function loadFiles(fs){
 const j=fs.find(f=>f.name.endsWith('.json')),b=fs.find(f=>f.name.endsWith('.bin'));
 if(!j){say('Choose gameai-model.json (from the for-chromebook folder on your PC).','w');return}
 try{const m=JSON.parse(await j.text());
  if(!m.b64){if(!b){say('That is the old two-file format. Pick model.json and model.bin together, or re-export on your PC.','w');return}
   const u=new Uint8Array(await b.arrayBuffer());let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));m.b64=btoa(s)}
  useAI(createAI(m,b64buf(m.b64)),'your model from '+j.name);await remember(m);say('Remembered: it will load automatically next time.','d')}
 catch(err){say('That model could not be loaded: '+esc(err.message),'e')}
}
async function decodeAny(prompt){
 if(API&&API.app&&API.loaded){const r=await fetch('api/decode',{method:'POST',body:JSON.stringify({prompt})});if(r.ok)return r.json()}
 return AI.decode(prompt);
}
const post=(u,b)=>fetch(u,{method:'POST',body:JSON.stringify(b||{})}).then(async r=>({ok:r.ok,...(await r.json().catch(()=>({})))}));
let watching=false;
function drawGraph(pts,opt){
 // pts: [{x, y, y2?, dot?}]  y = share fully right (0-1)
 const W=600,H=170,L=44,R=12,T=12,B=26,g=$('graph');if(!pts.length){g.innerHTML='';return}
 const ys=pts.flatMap(p=>[p.y,p.y2]).filter(v=>v!=null),lo=Math.max(0,Math.floor((Math.min(...ys)*100-1))/100),hi=Math.min(1,Math.ceil(Math.max(...ys)*100+.5)/100);
 const xs=pts.map(p=>p.x),x0=Math.min(...xs),x1=Math.max(...xs,x0+1e-9);
 const X=v=>L+(v-x0)/(x1-x0||1)*(W-L-R),Y=v=>T+(1-(v-lo)/(hi-lo||1))*(H-T-B);
 const line=(k,c,w,dash)=>{const q=pts.filter(p=>p[k]!=null);return q.length>1?`<polyline points="${q.map(p=>X(p.x)+','+Y(p[k])).join(' ')}" fill="none" stroke="${c}" stroke-width="${w}" ${dash?'stroke-dasharray="4 4"':''}/>`:''};
 let ticks='';for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4;ticks+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#232840"/><text x="${L-6}" y="${Y(v)+4}" fill="#8a90ad" font-size="11" text-anchor="end">${(v*100).toFixed(1)}%</text>`}
 const dots=pts.filter(p=>p.dot).map(p=>`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="4" fill="#b6f24a"/>`).join('');
 const lastP=pts.at(-1);
 g.innerHTML=ticks+line('y2','#8a90ad',1.5,true)+line('y','#b6f24a',2.5)+dots+
  `<text x="${L}" y="${H-6}" fill="#8a90ad" font-size="11">${esc(opt.x0)}</text><text x="${W-R}" y="${H-6}" fill="#8a90ad" font-size="11" text-anchor="end">${esc(opt.x1)}</text>`+
  `<text x="${Math.min(X(lastP.x)+6,W-R-60)}" y="${Y(lastP.y)-8}" fill="#b6f24a" font-size="12">${(lastP.y*100).toFixed(2)}%</text>`;
}
async function showLearning(statusLine){
 const rows=await fetch('api/learnhist').then(r=>r.json()).catch(()=>[]);
 if(!rows.length)return false;
 const t0=rows[0].time,hrs=(rows.at(-1).time-t0)/3600,gain=(rows.at(-1).exact-rows[0].exact)*100,ups=rows.filter((r,i)=>i&&r.promoted).length;
 $('gtitle').innerHTML='How smart your AI is';
 drawGraph(rows.map(r=>({x:(r.time-t0)/3600,y:r.exact,y2:r.natural??r.typo,dot:r.promoted})),{x0:'start',x1:hrs<1?Math.round(hrs*60)+' min of learning':hrs.toFixed(1)+' h of learning'});
 $('ptext').innerHTML=`Green line: how often it gets a game idea exactly right. Dashed: the same with natural, real-person wording (or typos, before the teacher has run). Each dot: it got smarter and switched to the new version.<br>So far: ${gain>=0?'+':''}${gain.toFixed(2)} points better, ${ups} upgrade${ups===1?'':'s'} in ${rows.length-1} round${rows.length===2?'':'s'}.${statusLine?'<br>'+statusLine:''}`;
 return true;
}
async function watch(){
 if(watching)return;watching=true;$('prog').classList.add('on');
 while(true){
  const j=await fetch('api/progress').then(r=>r.json()).catch(()=>null);if(!j)break;
  const pct=j.total?Math.round(j.step/j.total*100):0,st=j.stage||'',nice=/practice|training data/i.test(st)?'writing new practice questions':/learning|Training/.test(st)?`studying (${pct}%)`:/test/i.test(st)?'taking its test':/browser/i.test(st)?'packing up':st?'getting ready':'starting',rd=(st.match(/Round (\d+)/)||[])[1],now=`Right now: ${rd?'round '+rd+', ':''}${nice}`;
  if(j.kind==='teacher'){$('gtitle').textContent='The teacher is writing examples';$('graph').innerHTML='';$('ptext').innerHTML=`${j.step} of ${j.total} kept${j.loss!=null?` · ${Math.round(j.loss*100)}% passed the self-check`:''}<br><span class="d">${esc((j.log.filter(l=>l.startsWith('kept')).at(-1)||j.log.at(-1)||'starting…').replace(/^kept[^e]*e\.g\. /,'latest: '))}</span>`}
  else if(j.kind==='learn'){if(!await showLearning(now)){$('gtitle').textContent='Always-on learning';$('ptext').innerHTML=now}}
  else{
   $('gtitle').innerHTML='Training a new AI from scratch';
   drawGraph(j.evals.map(e=>({x:e.step,y:e.exact,y2:e.fields})),{x0:'step 0',x1:'step '+(j.evals.at(-1)||{step:0}).step});
   $('ptext').innerHTML=`Green line: how often it gets a practice game idea exactly right. Dashed: how often each single part is right.<br>${now}`;
  }
  if(!j.running){watching=false;
   if(j.kind!=='learn')$('prog').classList.remove('on');
   say(j.ok?'All done.':j.kind==='learn'?'Learning stopped.':'Something went wrong. Send Claude these lines:',j.ok?'a':'w');if(!j.ok&&j.kind!=='learn')say(esc(j.log.slice(-8).join('\n')),'d');
   const gl=j.log.find(l=>/Phase 1 gate/.test(l));if(gl&&j.kind!=='learn')say(/PASSED/.test(gl)?'It passed its test and is now your AI.':'It did not pass its test, so your old AI is still in use.','d');
   await boot();break}
  await new Promise(r=>setTimeout(r,1000));
 }
}
function options(f){return AI.options[FN.indexOf(f)].filter(v=>v!=='auto')}
function parseAnswer(f,t){
 t=t.trim().toLowerCase();if(!t||['s','surprise','surprise me','any','idk','you pick','whatever'].includes(t))return 'auto';
 const opts=options(f);if(/^\d+$/.test(t))return opts[+t-1]||null;
 if(opts.includes(t))return t;
 const syn=AI.synonyms[f]||{};for(const o of opts)if((syn[o]||[]).some(s=>t.includes(s)||s.includes(t)))return o;
 return null;
}
function askNext(){
 const q=pending.queue[pending.i];
 const opts=options(q.f);
 const lead=q.unsure?`I'm not sure about the ${q.f}; my guess was ${q.guess}. `:'';
 const d=say(`<span class="a">${esc(lead+QTEXT[q.f]||('Which '+q.f+'?'))}</span> <span class="d">(number, word, or Enter to let me pick)</span>`,'a');
 const c=document.createElement('div');c.className='chips';
 opts.forEach((o,i)=>{const b=document.createElement('button');b.textContent=`${i+1} ${LABEL[o]||o}`;b.onclick=()=>answer(String(i+1));c.appendChild(b)});
 const s=document.createElement('button');s.textContent='surprise me';s.onclick=()=>answer('');c.appendChild(s);d.appendChild(c);
}
function answer(t){
 const q=pending.queue[pending.i],long=t.trim().split(/\s+/).length>3,v=long?null:parseAnswer(q.f,t);
 if(v===null){if(long){pending=null;say('&gt; '+esc(t),'u');say('Skipping the questions; making a new game from that.','d');make(t.trim(),false);return}say(`I didn't catch that. Try a number from the list.`,'w');return}
 say('&gt; '+esc(t||'(you pick)'),'u');pending.pred[q.f]={value:v,conf:1};pending.i++;
 if(pending.i<pending.queue.length)askNext();else{const p=pending;pending=null;finish(p.prompt,p.pred,false)}
}
async function make(prompt,edit){
 if(!AI){say('No AI loaded yet. Type /load.','w');return}
 if(edit&&!lastGame){say('No game to change yet. Describe one first.','w');return}
 const t0=performance.now(),pred=await decodeAny(prompt),ms=performance.now()-t0;
 for(const f of FN){const p=pred[f];if(p.value!=='auto'&&p.conf<GATE){p.unsure=true;p.guess=p.value;p.value='auto'}}
 if(askOn&&!edit){
  const queue=[...FN.filter(f=>pred[f].unsure&&QTEXT[f]).map(f=>({f,unsure:true,guess:pred[f].guess})),...IMPORTANT.filter(f=>pred[f].value==='auto'&&!pred[f].unsure).map(f=>({f}))].slice(0,2);
  if(queue.length){say(`Quick question${queue.length>1?'s':''} so it's the game you want:`,'d');pending={prompt,pred,queue,i:0};askNext();return}
 }
 finish(prompt,pred,edit,ms);
}
const PLACE={forest:'a forest',dungeon:'a spooky dungeon',space:'space',desert:'the desert',snow:'the snow',ocean:'the ocean',volcano:'a volcano'};
const GOAL={coins:'collecting coins',gems:'hunting for gems',exit:'trying to find the exit',survive:'trying to survive as long as you can'};
const HOW={few:'a few',some:'some',many:'lots of'};
const TRIG_T={collect:x=>'whenever you collect something',hit:x=>'whenever you get hit',every:x=>`every ${x.tn} seconds`,score:(x,r)=>`after you collect ${x.tn} ${r&&(r.goal==='coins'||r.goal==='gems')?r.goal:'keys'}`,powerup:x=>'whenever you grab a power-up'};
const ACT_T={spawn:x=>x.an==='3'?'3 more enemies appear':'a new enemy appears',faster:x=>'the enemies speed up',slower:x=>'the enemies slow down',boost:x=>'you get a speed boost',heal:x=>'you get a heart back',teleport:x=>'you teleport somewhere random',open_exit:x=>'the exit unlocks',freeze:x=>'the enemies freeze for 3 seconds'};
const ruleText=(x,r)=>{const t=TRIG_T[x.trig](x,r);return t[0].toUpperCase()+t.slice(1)+', '+ACT_T[x.act](x)+'.'};
function rulesFrom(pred){const out=[];for(let i=1;i<=2;i++){const t=pred['r'+i+'_trig'];if(t&&t.value!=='none')out.push({trig:t.value,tn:pred['r'+i+'_tn'].value,act:pred['r'+i+'_act'].value,an:pred['r'+i+'_an'].value})}return out}
function describe(r,src,edit){
 if(edit){const ch=FN.filter(f=>src[f]==='ai').map(f=>({difficulty:r.difficulty==='hard'?'harder':r.difficulty==='easy'?'easier':'normal difficulty',speed:r.speed==='fast'?'faster':r.speed==='slow'?'slower':'normal speed',size:r.size==='big'?'a bigger map':r.size==='small'?'a smaller map':'a medium map',
  powerup:r.powerup==='none'?'no power-ups':'added '+({hearts:'health hearts',boots:'speed boots',shield:'shields'})[r.powerup],count:HOW[r.count]+' enemies',enemy:r.enemy==='none'?'no enemies':r.enemy+' as the enemies',theme:'moved it to '+PLACE[r.theme],player:'you\'re now a '+r.player,goal:'the goal is now '+GOAL[r.goal]})[f]);
  if(src.rules==='ai')ch.push('new rules: '+r.rules.map(x=>ruleText(x,r)).join(' ').toLowerCase().replace(/\.$/,''));
  return ch.length?`Done: ${ch.join(', ')}. Everything else is the same.`:`I couldn't tell what to change, so it's the same game. Try something like "make it harder" or "add speed boots".`}
 let t=`Here's your game: you're a ${r.player} in ${PLACE[r.theme]}, ${GOAL[r.goal]}`+(r.enemy==='none'?', with nothing chasing you.':` while ${HOW[r.count]} ${r.enemy} chase you.`);
 const x=[];if(r.speed!=='normal')x.push(`you move ${r.speed==='fast'?'fast':'slowly'}`);if(r.difficulty!=='normal')x.push(`it's ${r.difficulty}`);if(r.size!=='medium')x.push(`the map is ${r.size}`);
 if(r.powerup!=='none')x.push(`there are ${({hearts:'health hearts',boots:'speed boots',shield:'shields'})[r.powerup]} to grab`);
 if(x.length)t+=' Also, '+x.join(', ')+'.';
 if(r.rules&&r.rules.length)t+=' Rules: '+r.rules.map(x=>ruleText(x,r)).join(' ');
 const picked=['theme','player','goal','enemy'].filter(f=>src[f]==='auto').map(f=>({theme:'the place',player:'the character',goal:'the goal',enemy:'the enemies'})[f]);
 if(picked.length)t+=` You didn't mention ${picked.join(' or ')}, so I picked ${picked.length>1||picked[0]==='the enemies'?'them':'it'}.`;
 return t;
}
let lastDetails='';
function finish(prompt,pred,edit,ms){
 const P={};for(const f of FN)P[f]={use:pred[f].value};
 const {r,src}=resolve(P,edit?lastGame.r:null),nr=rulesFrom(pred);r.rules=nr.length||!edit?nr:(lastGame.r.rules||[]);src.rules=nr.length?'ai':'kept';build(r);lastGame={prompt,r,time:new Date().toISOString()};
 const rows=FN.map(f=>{const c=pred[f].conf,ai=src[f]==='ai';const cls=!ai?'d':c>=.9?'a':c>=.6?'w':'e';
  return `<tr><td class="d">${f}</td><td class="${ai?'u':'d'}">${ai?esc(r[f]):`${src[f]==='kept'?'kept':'auto'} → ${esc(r[f])}`}</td><td class="${cls}">${ai?Math.round(c*100)+'%':''}</td></tr>`}).join('');
 lastDetails=`<table>${rows}${(r.rules||[]).map((x,i)=>`<tr><td class="d">rule ${i+1}</td><td class="u">${esc(ruleText(x,r))}</td><td></td></tr>`).join('')}</table>`;
 say(esc(describe(r,src,edit))+`<br><span class="d">Click the game to play. Try /edit make it harder, /rate 1-5, or /details to see how sure I was.</span>`);
 const ep=store.get('gameai.episodes',[]);ep.push({...lastGame,edit});store.set('gameai.episodes',ep.slice(-500));
 setTimeout(()=>cv.focus(),0);
}
const HELP=[['your idea','make a game, e.g. a fast ninja in a spooky dungeon'],['/edit <change>','change the last game, e.g. /edit make it harder'],['/rate <1-5> [note]','rate the last game'],['/details','see each part of the last game and how sure the AI was'],['/questions on|off','turn the AI\'s questions on or off'],
 ['/train [size]','PC app: train a new AI (tiny, small, base, large) with a live progress bar'],['/learn on|off','PC app: always-on learning; it keeps getting smarter while you use it'],['/graph','PC app: show the how-smart graph'],['/teacher [n]','PC app: a free open AI writes natural practice examples (default 2000)'],['/update','PC app: check for a new version now (it also checks every 10 minutes)'],['/test','PC app: run the benchmark'],['/runs','PC app: past training runs'],['/save [name]','PC app: save the game as one HTML file'],['/open','PC app: open the game in a browser tab'],
 ['/share on|off','PC app: let your Chromebook use this PC over Wi-Fi (always up to date)'],['/chromebook','PC app: make an offline copy for your Chromebook'],['/load','Chromebook: load gameai-model.json (or drag it onto the page)'],['/ratings','copy your ratings'],['/status','show the loaded AI'],['/clear','clear the terminal']];
const needApp=()=>{if(API&&API.app)return false;say('That command works in the PC app (start.bat on your PC).','w');return true};
function command(line){
 if(pending&&line.startsWith('/')){pending=null;say('Question skipped.','d')}
 if(pending){answer(line);return}
 say('&gt; '+esc(line),'u');
 const [cmd,...rest]=line.split(' '),arg=rest.join(' ').trim();
 if(!line.startsWith('/'))return make(line,false);
 switch(cmd.toLowerCase()){
  case '/help':say('<table>'+HELP.map(([a,b])=>`<tr><td class="a">${esc(a)}</td><td class="d">${esc(b)}</td></tr>`).join('')+'</table>');break;
  case '/edit':arg?make(arg,true):say('Use: /edit make it harder','w');break;
  case '/rate':{const m=arg.match(/^([1-5])\s*(.*)$/);if(!lastGame){say('Make a game first.','w');break}if(!m){say('Use: /rate 4 fun but short','w');break}
   const rs=store.get('gameai.ratings',[]);rs.push({...lastGame,rating:+m[1],note:m[2]});store.set('gameai.ratings',rs);say(`Saved. ${rs.length} rating${rs.length>1?'s':''} so far.`);break}
  case '/train':if(needApp())break;post('api/train',{size:arg||'small'}).then(r=>{if(!r.ok)say(esc(r.error||'Could not start.'),'w');else{say(`Training a ${esc(arg||'small')} AI from scratch. You can keep making games meanwhile.`);watch()}});break;
  case '/learn':if(needApp())break;post('api/learn',{on:arg!=='off'}).then(r=>{if(!r.ok)say(esc(r.error),'w');else if(r.stopping)say('Stopping after the current round finishes.','d');else{say('Always-on learning started. Keep making games; it switches to each smarter version automatically.');watch()}});break;
  case '/graph':if(needApp())break;$('prog').classList.add('on');showLearning('').then(ok=>{if(!ok){$('prog').classList.remove('on');say('No learning history yet. Type /learn on.','d')}});break;
  case '/test':if(needApp())break;post('api/test').then(r=>{if(!r.ok)say(esc(r.error),'w');else watch()});break;
  case '/runs':if(needApp())break;fetch('api/runs').then(r=>r.json()).then(rs=>say(rs.length?'<table>'+rs.map(r=>`<tr><td class="d">${esc(r.id)}</td><td>${r.exact!=null?(r.exact*100).toFixed(2)+'%':''}</td><td class="d">${r.promoted?'promoted':''}</td></tr>`).join('')+'</table>':'No runs yet.'));break;
  case '/save':if(!lastGame){say('Make a game first.','w');break}
   if(!(API&&API.app)){if(!window.GAMEAI_GAME_TPL){say('Saving works in the GameAI.html app file (make it on your PC with /chromebook).','w');break}
    try{const html=window.GAMEAI_GAME_TPL.replace('/*GAMEAI_RECIPE*/','window.GAMEAI_RECIPE='+JSON.stringify(lastGame.r)+';'),a=document.createElement('a');
     a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=(arg||lastGame.r.player+'-'+lastGame.r.theme).replace(/[^\w-]/g,'')+'.html';document.body.appendChild(a);a.click();a.remove();say('Saved to your Downloads folder. Open it any time to play.')}
    catch(e){say('This browser blocked the download.','w')}break}post('api/save',{recipe:lastGame.r,name:arg}).then(r=>say(r.ok?`Saved: ${esc(r.path)}`:esc(r.error),r.ok?'a':'w'));break;
  case '/open':if(needApp())break;if(!lastGame){say('Make a game first.','w');break}post('api/save',{recipe:lastGame.r,name:'last-game'}).then(r=>{if(r.ok)window.open(r.url,'_blank')});break;
  case '/chromebook':if(needApp())break;post('api/chromebook').then(r=>say(r.ok?`Your Chromebook app is ready: ${esc(r.path)}<br><span class="d">Put it on your Chromebook (Google Drive or a USB stick) and open it in Chrome. Your AI is built in. Do this again whenever your AI gets smarter.</span>`:esc(r.error),r.ok?'a':'w'));break;
  case '/details':say(lastDetails||'Make a game first.','d');break;
  case '/share':if(needApp())break;post('api/share',{on:arg!=='off'}).then(r=>{if(!r.ok){say(esc(r.error||'Could not share.'),'w');return}
   if(r.url)say(`Sharing is on. On your Chromebook (same Wi-Fi), open:<br><span class="u">${esc(r.url)}</span><br>Code: <span class="u" style="font-size:20px">${esc(r.pin)}</span><br><span class="d">Then install it as an app from Chrome's menu. It always has your newest AI and terminal while this PC app is running. If Windows asks about the firewall, click Allow.</span>`);else say('Sharing is off.','d')});break;
  case '/teacher':if(needApp())break;post('api/teacher',{n:+arg||2000}).then(r=>{if(!r.ok)say(esc(r.error),'w');else{say(`The teacher is writing ${r.n} natural examples for your AI. The first time, it downloads itself (about 6 GB). When it's done, type /train or /learn on so your AI learns from them.`);watch()}});break;
  case '/update':if(needApp())break;say('Checking for updates…','d');post('api/update').then(r=>say(r.installed?`Installing: ${esc(r.message)}. The app restarts in a moment.`:r.error?esc(r.error):'Already up to date.',r.installed?'a':'d'));break;
  case '/questions':askOn=arg!=='off';store.set('gameai.ask',askOn);say(`Questions ${askOn?'on':'off'}.`);break;
  case '/load':$('files').click();say('Pick gameai-model.json (from the for-chromebook folder on your PC).','d');break;
  case '/ratings':{const t=JSON.stringify(store.get('gameai.ratings',[]));navigator.clipboard?.writeText(t).then(()=>say('Ratings copied. Paste them into a file on your PC.'),()=>say('Copy was blocked by the browser.','w'));break}
  case '/status':say(AI?`Using ${esc(lastWhere)}. Its brain has ${(AI.params/1e6).toFixed(1)} million numbers. Questions are ${askOn?'on':'off'}. You've rated ${store.get('gameai.ratings',[]).length} games.`:'No AI loaded yet.','d');break;
  case '/clear':log.innerHTML='';break;
  default:say(`Unknown command ${esc(cmd)}. Type /help.`,'w');
 }
}
$('files').addEventListener('change',async e=>{await loadFiles([...e.target.files]);e.target.value=''});
addEventListener('dragover',e=>{e.preventDefault();document.body.classList.add('drag')});
addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('drag')});
addEventListener('drop',e=>{e.preventDefault();document.body.classList.remove('drag');loadFiles([...e.dataTransfer.files])});
inp.addEventListener('keydown',e=>{if(e.key==='Enter'){const v=inp.value;inp.value='';if(v.trim()||pending)command(v.trim())}});
addEventListener('keydown',e=>{if(e.target===inp)return;keys[e.code]=true;
 if(S&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
 if(S&&S.state!=='play'&&(e.code==='KeyR'||e.code==='Enter'))build(S.r);
 if(e.key==='/'&&e.target!==inp){e.preventDefault();inp.focus();inp.value='/'}});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
$('log').addEventListener('click',()=>inp.focus());
say(`<pre class="ban">  ____                         _    ___
 / ___| __ _ _ __ ___   ___   / \\  |_ _|
| |  _ / _\` | '_ \` _ \\ / _ \\ / _ \\  | |
| |_| | (_| | | | | | |  __// ___ \\ | |
 \\____|\\__,_|_| |_| |_|\\___/_/   \\_\\___|</pre><span class="d">your own game-making AI · type /help</span>`);
boot();inp.focus();
}
